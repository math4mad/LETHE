name: Build Chora/Cora Paper

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live (minimal)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-fonts-recommended texlive-latex-extra texlive-xetex

      - name: Compile LaTeX to PDF
        run: |
          xelatex -interaction=nonstopmode ms.tex
          bibtex ms.aux 2>/dev/null || true
          xelatex -interaction=nonstopmode ms.tex
          xelatex -interaction=nonstopmode ms.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChoraCora_paper
          path: ms.pdf
          retention-days: 30

  deploy-ghpages:
    needs: build-pdf
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live (minimal)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-fonts-recommended texlive-latex-extra texlive-xetex

      - name: Compile LaTeX to PDF
        run: |
          xelatex -interaction=nonstopmode ms.tex
          bibtex ms.aux 2>/dev/null || true
          xelatex -interaction=nonstopmode ms.tex
          xelatex -interaction=nonstopmode ms.tex

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          keep_files: true
